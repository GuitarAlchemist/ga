name: Auto-Update Demerzel Submodule

on:
  repository_dispatch:
    types: [demerzel-updated]
  # Fallback: check every 6 hours in case dispatch was missed
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours UTC

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "demerzel-bot"
          git config user.email "demerzel-bot@users.noreply.github.com"

      - name: Check current submodule state
        id: check
        run: |
          cd governance/demerzel
          CURRENT=$(git rev-parse --short HEAD)
          git fetch origin master
          LATEST=$(git rev-parse --short origin/master)
          BEHIND=$(git rev-list --count HEAD..origin/master)

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

          echo "Submodule at $CURRENT, latest is $LATEST, $BEHIND commits behind"

      - name: Skip if up to date
        if: steps.check.outputs.behind == '0'
        run: echo "Submodule is up to date, nothing to do"

      - name: Update submodule
        if: steps.check.outputs.behind != '0'
        run: |
          cd governance/demerzel
          git checkout origin/master
          cd ../..
          git add governance/demerzel

      # Auto-commit for small updates (<=10 commits behind)
      - name: Auto-commit small update
        if: steps.check.outputs.behind != '0' && steps.check.outputs.behind <= 10
        run: |
          BEHIND=${{ steps.check.outputs.behind }}
          git commit -m "chore: update Demerzel submodule ($BEHIND commits)"
          git push origin main
          echo "### Auto-updated Demerzel submodule ($BEHIND commits)" >> $GITHUB_STEP_SUMMARY

      # Create PR for large updates (>10 commits behind)
      - name: Create PR for large update
        if: steps.check.outputs.behind != '0' && steps.check.outputs.behind > 10
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BEHIND=${{ steps.check.outputs.behind }}
          CURRENT=${{ steps.check.outputs.current }}
          LATEST=${{ steps.check.outputs.latest }}
          LATEST_FULL=$(git -C governance/demerzel rev-parse origin/master)

          # Advance the open update PR if there is one; otherwise open a branch
          # named for the target commit. The old per-day branch made every
          # same-day re-run (this job fires on each Demerzel push and every 6h)
          # fail non-fast-forward, and would have opened a fresh PR each day.
          OPEN_BRANCH=$(gh pr list --state open --json headRefName \
            -q '[.[] | select(.headRefName | startswith("chore/update-demerzel-"))][0].headRefName // empty')
          git restore --staged governance/demerzel
          if [ -n "$OPEN_BRANCH" ]; then
            BRANCH="$OPEN_BRANCH"
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" FETCH_HEAD
          else
            BRANCH="chore/update-demerzel-$LATEST"
            git checkout -q -b "$BRANCH"
          fi
          git update-index --cacheinfo "160000,$LATEST_FULL,governance/demerzel"
          if git diff --cached --quiet; then
            echo "$BRANCH already points governance/demerzel at $LATEST"
          else
            git commit -m "chore: update Demerzel submodule ($BEHIND commits)"
            git push origin "$BRANCH"
          fi

          # Not `git log | head -15`: under the runner's `-o pipefail`, head closing
          # the pipe SIGPIPEs git log (exit 141) once the backlog outgrows 15
          # commits, killing the step after the push but before the PR exists.
          cd governance/demerzel
          CHANGES=$(git log --oneline -15 "$CURRENT..$LATEST")
          cd ../..

          if [ -n "$OPEN_BRANCH" ]; then
            gh pr edit "$BRANCH" --title "chore: update Demerzel submodule ($BEHIND commits behind)"
            echo "### Advanced open PR on $BRANCH ($BEHIND commits)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          gh pr create \
            --title "chore: update Demerzel submodule ($BEHIND commits behind)" \
            --body "$(cat <<EOF
          ## Demerzel Submodule Update

          The governance submodule is **$BEHIND commits behind** — creating a PR for review since this is a large update.

          - **Current:** \`$CURRENT\`
          - **Latest:** \`$LATEST\`

          ### Recent changes:
          \`\`\`
          $CHANGES
          \`\`\`

          ---
          *Auto-generated by submodule-auto-update workflow*
          EOF
          )"

          echo "### Created PR to update Demerzel submodule ($BEHIND commits)" >> $GITHUB_STEP_SUMMARY
